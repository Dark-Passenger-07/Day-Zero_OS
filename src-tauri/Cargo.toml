[package]
name = "day-zero-os"
version = "1.0.0"
description = "Day Zero OS — The unified digital workspace & operating system for builders"
authors = ["Day Zero Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[lib]
name = "day_zero_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.3", features = [] }
tauri-plugin-shell = "2.0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
